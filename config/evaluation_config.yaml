# Evaluation-only input: labels must join after all system risk scores are frozen.
corpus: AfriSpeech-200
partition: official_test
evaluation_input_jsonl: results/human_speech/predictions/afrispeech_test_scored.jsonl
label_field: is_medication_error
score_fields:
  token_confidence: token_confidence_risk
  nbest_uncertainty: nbest_entropy
  recognizer_disagreement: recognizer_disagreement
  lexical_phonetic_anomaly: lexical_phonetic_anomaly_score
  combined_text_baseline: combined_text_risk
  audio_aware_auditor: audio_aware_risk
review_budgets: [0.01, 0.05, 0.10, 0.20]
bootstrap_replicates: 1000
seed: 20261030
output_json: results/human_speech/evaluation_afrispeech_test.json
