# Local synthetic fixtures for deterministic code-path smoke tests only.
# These are not AfriSpeech-200/PriMock57 samples and do not establish dataset feasibility.
purpose: synthetic_pipeline_smoke_test_only
vocabulary_csv: data/vocabulary/medication_vocabulary.csv
stopping_rules:
  minimum_mentions: 30
  minimum_ingredients: 9
  minimum_speakers: 10
  require_versioned_vocabulary: true
  require_dataset_revision: true
dry_run:
  output_dir: results/stub_dry_run
  seed: 20261030
  held_out_ingredients: ["RXNORM:5553"]
  paper_artifacts_config: config/stubs/paper_artifacts.yaml
datasets:
  afrispeech200_stub:
    source: local_manifest
    dataset_id: synthetic-afrispeech-schema-fixture
    revision: fixture-afrispeech-200-v1
    root: config/stubs
    manifest: config/stubs/afrispeech_stub_manifest.json
    license: synthetic test fixture; no corpus license applies
    split_field: split
    official_speaker_split: true
    speaker_field: speaker_id
    text_field: transcript
    medication_field: medication_name
    consultation_field: consultation_id
  primock57_stub:
    source: local_manifest
    dataset_id: synthetic-primock57-schema-fixture
    source_revision: fixture-primock57-v1
    root: config/stubs
    manifest: config/stubs/primock57_stub_manifest.json
    license: synthetic test fixture; no corpus license applies
    split_field: split
    speaker_field: speaker_id
    text_field: transcript
    medication_field: medication_name
    consultation_field: consultation_id
