# Copy to a private local config after obtaining authorized corpus access.
purpose: real_human_speech_research
vocabulary_csv: data/vocabulary/medication_vocabulary.csv
stopping_rules:
  minimum_mentions: 30
  minimum_ingredients: 10
  minimum_speakers: 10
  require_versioned_vocabulary: true
  require_dataset_revision: true
datasets:
  afrispeech200:
    source: huggingface
    dataset_id: intronhealth/afrispeech-200
    revision: "PIN_VERIFIED_HUGGINGFACE_COMMIT"
    configuration: all
    splits: [train, dev, test]
    access_terms_accepted: false # set true locally only after accepting Hugging Face terms
    trust_remote_code: true
    inventory_max_records: 0
    root: data/external/afrispeech-200
    manifest: data/external/afrispeech-200/metadata.csv
    license: CC BY-NC-SA 4.0
    split_field: split
    official_speaker_split: true
    speaker_field: speaker_id
    text_field: transcript
    medication_field: medication_name
    consultation_field: recording_id
  primock57:
    source: local_manifest
    dataset_id: babylonhealth/primock57
    revision: "PIN_VERIFIED_GITHUB_COMMIT"
    source_revision: "PIN_VERIFIED_GITHUB_COMMIT"
    root: data/external/primock57
    manifest: data/external/primock57/manifest.jsonl
    audio_root: data/external/primock57/audio
    license: CC BY 4.0
    split_field: split
    speaker_field: speaker_id
    text_field: transcript
    medication_field: medication_name
    consultation_field: consultation_id
