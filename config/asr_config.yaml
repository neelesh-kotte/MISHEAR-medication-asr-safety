# Populate and freeze exact model revisions and decoding before test runs.
recognizers:
  - name: whisper.cpp
    backend: whisper.cpp
    executable: null  # e.g. /path/to/whisper.cpp/build/bin/whisper-cli
    model: null        # local ggml model file
    version: null
    decoding:
      language: en
      threads: 4
      beam_size: 5
      best_of: 5
      temperature: 0.0
      no_gpu: false
  - name: wav2vec2
    backend: transformers-ctc
    model: facebook/wav2vec2-base-960h
    version: null
    decoding:
      decoder: greedy_ctc
      device: auto
