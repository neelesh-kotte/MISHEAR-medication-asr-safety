# Copy locally and fill paths only after corpus access and labels are verified.
output_dir: results/paper_artifacts
inventory_json: results/inventory/feasibility.json
seed: 20261030
ablation:
  training_csv: data/processed/development_train_features.csv
  development_csv: data/processed/development_validation_features.csv
  label_field: is_medication_error
  review_budgets: [0.01, 0.05, 0.10, 0.20]
  bootstrap_replicates: 1000
  cluster_fields: [speaker_id, consultation_id]
evaluation_sets:
  afrispeech_unseen_speakers:
    predictions_jsonl: results/evaluation/afrispeech_unseen_speakers.jsonl
    label_field: is_medication_error
    score_fields:
      confidence: confidence_risk
      disagreement: disagreement_risk
      lexical_phonetic: lexical_phonetic_risk
      combined: combined_risk
      audio_aware: audio_aware_risk
    cluster_fields: [speaker_id, consultation_id]
    review_budgets: [0.01, 0.05, 0.10, 0.20]
    bootstrap_replicates: 1000
  afrispeech_unseen_ingredients:
    predictions_jsonl: results/evaluation/afrispeech_unseen_ingredients.jsonl
